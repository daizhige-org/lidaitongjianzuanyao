<!doctype html>
<html lang="zh-Hant">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歷代通鑑纂要</title>
<meta name="description" content="《歷代通鑑纂要》九十二卷（明正德二年內府刻本）在線閱讀：維基文庫校本、機器標點與 AI 白話解釋對照。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%23a8322b'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='%23f3f4f0' font-family='serif'%3E鑑%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://jigmo.digitalhumanities.dev" crossorigin>

<script>
  // 先於首次繪製套用主題與字號，避免閃爍
  try {
    var s = JSON.parse(localStorage.getItem("tjzy.settings") || "{}");
    if (s.theme && s.theme !== "auto") document.documentElement.dataset.theme = s.theme;
    if (s.fs) document.documentElement.style.setProperty("--fs", s.fs + "px");
  } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>

<header class="top" id="top">
  <button class="icon" id="btn-side" aria-label="目錄" title="目錄（T）" aria-expanded="false">
    <svg viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="#/">歷代通鑑纂要</a>
  <div class="where" id="where"></div>
  <form class="search" id="search-form" role="search">
    <input id="q" type="search" placeholder="全文檢索，繁簡異體皆可" autocomplete="off" aria-label="全文檢索">
    <kbd>/</kbd>
  </form>
  <button class="icon" id="btn-expl" aria-pressed="false" title="顯示全部解釋（E）">
    <span class="glyph">釋</span>
  </button>
  <button class="icon" id="btn-scan" aria-pressed="false" title="掃描原圖（I）">
    <span class="glyph">圖</span>
  </button>
  <button class="icon" id="btn-set" aria-label="閱讀設置" aria-expanded="false" title="閱讀設置">
    <span class="glyph">Aa</span>
  </button>
  <a class="gh" id="gh" href="https://github.com/daizhige-org/lidaitongjianzuanyao" target="_blank" rel="noopener noreferrer" title="在 GitHub 上為本站點亮 Star" aria-label="Star on GitHub">

    <span class="gh-star" aria-hidden="true">★</span>
    <span class="gh-lab">Star</span>
  </a>
  <div class="progress" aria-hidden="true"><i id="progress"></i></div>
</header>

<div class="popover" id="settings" hidden>
  <div class="row">
    <span class="lab">字號</span>
    <div class="seg-ctl">
      <button data-fs="-1" aria-label="縮小字號">小</button>
      <output id="fs-out">19</output>
      <button data-fs="1" aria-label="放大字號">大</button>
    </div>
  </div>
  <div class="row">
    <span class="lab">外觀</span>
    <div class="seg-ctl" id="theme-ctl">
      <button data-theme="auto">隨系統</button>
      <button data-theme="light">淺色</button>
      <button data-theme="dark">深色</button>
    </div>
  </div>
  <div class="row">
    <span class="lab">正文</span>
    <div class="seg-ctl" id="src-ctl">
      <button data-src="best" title="已校對的頁用維基文庫文本，其餘用機器標點">校本優先</button>
      <button data-src="machine" title="全部使用機器標點文本">機器標點</button>
    </div>
  </div>
  <p class="hint" id="src-hint" hidden></p>
  <div class="row">
    <span class="lab">解釋</span>
    <div class="seg-ctl" id="expl-ctl">
      <button data-all="0">點句顯示</button>
      <button data-all="1">全部顯示</button>
    </div>
  </div>
  <p class="keys"><kbd>/</kbd> 檢索　<kbd>E</kbd> 解釋　<kbd>T</kbd> 目錄　<kbd>I</kbd> 原圖　<kbd>←</kbd><kbd>→</kbd> 上一卷、下一卷</p>
</div>

<aside class="side" id="side" aria-label="目錄">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-juan" aria-selected="true" aria-controls="pane-juan">卷目</button>
    <button role="tab" id="tab-outline" aria-selected="false" aria-controls="pane-outline">本卷綱目</button>
  </div>
  <nav class="pane" id="pane-juan" role="tabpanel" aria-labelledby="tab-juan"></nav>
  <div class="pane" id="pane-outline" role="tabpanel" aria-labelledby="tab-outline" hidden>
    <input id="outline-filter" type="search" placeholder="篩選本卷綱目" aria-label="篩選本卷綱目">
    <nav id="outline-list"></nav>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>

<main id="main" tabindex="-1"></main>

<aside class="scan" id="scan" hidden aria-label="掃描原圖">
  <header>
    <strong id="scan-title"></strong>
    <button class="icon" id="scan-prev" aria-label="上一頁" title="上一頁">‹</button>
    <button class="icon" id="scan-next" aria-label="下一頁" title="下一頁">›</button>
    <button class="icon" id="scan-close" aria-label="關閉掃描圖" title="關閉（Esc）">×</button>
  </header>
  <div class="scan-links" id="scan-links"></div>
  <div class="scan-body" id="scan-body"></div>
</aside>

<script src="app.js"></script>
</body>
</html>
